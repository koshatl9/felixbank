services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: felixbank-app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT}
      APP_DEBUG: ${APP_DEBUG}
      APP_RELOAD: ${APP_RELOAD}
      SECRET_KEY: ${SECRET_KEY}
      MYSQL_HOST: ${MYSQL_HOST_DOCKER}
      MYSQL_PORT: ${MYSQL_PORT_DOCKER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: felixbank-mysql
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT_LOCAL}:${MYSQL_PORT_DOCKER}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
