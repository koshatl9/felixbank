<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form login and password</title>
    <link rel="stylesheet" href="{{ url_for('serve_static_file', filename='css/login.css') }}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="wrapper__brand">
            <div class="wrapper__brand-title">felixBANK</div>
            <img
                class="wrapper__brand-image"
                src="{{ url_for('serve_assets', filename='mascot.png') }}"
                alt="Mascot"
                loading="lazy"
            >
        </div>
        <form action="" method="post" autocomplete="on" novalidate>
            <h1>Login</h1>

            {% if error %}
                <p class="wrapper__error">
                    {{ error }}
                </p>
            {% endif %}

            <div class="input-box">
                <input type="text" name="login" placeholder="Username" required autocomplete="username">
                <i class="bx bx-user"></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
                <i class="bx bx-lock-alt"></i>
            </div>

            <div class="remember">
                <label><input type="checkbox" disabled> Remember me</label>
                <a href="{{ url_for('register') }}">Register</a>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="register-link">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
        </div>
    </div>
</body>
</html>
