<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form login and password</title>
    <link rel="stylesheet" href="{{ url_for('serve_login_css') }}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div style="display:grid; place-items:center; margin-bottom: 14px;">
            <div style="margin-bottom: 8px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;">felixBANK</div>
            <img
                src="{{ url_for('serve_assets', filename='mascot.png') }}"
                alt="Mascot"
                loading="lazy"
                style="width: 120px; height: auto; filter: drop-shadow(0 18px 40px rgba(0,0,0,0.35));"
            >
        </div>
        <form action="" method="post" autocomplete="on" novalidate>
            <h1>Login</h1>

            {% if error %}
                <p style="margin: 0 0 16px; padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.22);">
                    {{ error }}
                </p>
            {% endif %}

            <div class="input-box">
                <input type="text" name="login" placeholder="Username" required autocomplete="username">
                <i class="bx bx-user"></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
                <i class="bx bx-lock-alt"></i>
            </div>

            <div class="remember">
                <label><input type="checkbox" disabled> Remember me</label>
                <a href="{{ url_for('register') }}">Register</a>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="register-link">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
        </div>
    </div>
</body>
</html>
